name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar e rodar exemplos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar todos os .java
        run: javac -d out $(find . -name '*.java' -not -path './.git/*')

      - name: Conferir que nenhum .class foi commitado
        run: |
          if git ls-files | grep -q '\.class$'; then
            echo "::error::existe bytecode versionado no git"
            git ls-files | grep '\.class$'
            exit 1
          fi
          echo "nenhum .class no indice, ok"

      - name: Rodar os exemplos que nao pedem teclado
        run: |
          set -e
          for c in Aula1 ExemploMatriz MatrizCincoCinco MatrizOitoPreco \
                   MatrizRandomica Hipercubo8D Teste Teste2 POO_first; do
            echo "--- $c"
            java -cp out "$c" < /dev/null
          done

      - name: Conferir que os .class gerados nao entraram no git
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::o build sujou o repositorio:"
            git status --porcelain
            exit 1
          fi
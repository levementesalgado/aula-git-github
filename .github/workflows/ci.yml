name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar
        run: javac OlaGithub.java Hipercubo8D.java

      - name: Rodar OlaGithub
        run: |
          output=$(java OlaGithub)
          echo "$output"
          echo "$output" | grep -q "GitHub"

      - name: Rodar Hipercubo8D
        run: java Hipercubo8D
